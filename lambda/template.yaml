AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Charging Stations Lambda - invokable from another account

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 128
    Timeout: 10

Parameters:

  SesFromEmail:
    Type: String
    Default: "mike.volchek17@gmail.com"
    Description: Verified SES sender email
  
  BookingTimeoutMinutes:
    Type: Number
    Default: 3
    Description: Booking timeout used by session pricing/booking flows

  DynamoDBRouteTable1Id:
    Type: String
    Description: Route table id (rtb-...) used by private subnet 1 for DynamoDB gateway endpoint
    Default: rtb-0fdf4c197cd94cdef

  InvokerAccountIdA:
    Type: String
    Description: AWS account ID that is allowed to invoke this Lambda (e.g. the account that runs Node.js and calls Invoke)
    Default: "773769103104"

  InvokerAccountIdB:
    Type: String
    Description: AWS account ID that is allowed to invoke this Lambda (e.g. the account that runs Node.js and calls Invoke)
    Default: ""
  # VPC and subnets (must be private subnets that can reach each other)
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for Lambda and RDS
    Default: vpc-0d3987aee1c745343

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet (for RDS and Lambda)
    Default: subnet-097b4a2befe615aad

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet (RDS multi-AZ subnet group needs ≥2; for single-AZ one is enough but group still needs 2)
    Default: subnet-05bdebc566310d684
  # DB credentials (stored in parameter; for production prefer Secrets Manager)
  DBName:
    Type: String
    Description: Name of the database
    Default: charging_stations_rds_postgres
  # Optional: instance class and storage
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Instance class for RDS PostgreSQL
  DBAllocatedStorage:
    Type: String
    Default: "20"
    Description: Allocated storage for RDS PostgreSQL
  DBSecretArn:
    Type: String
    Description: ARN of existing DB secret
    Default: arn:aws:secretsmanager:il-central-1:852215679994:secret:charging-stations-rds-postgres-credentials-adUrnW

  
Conditions:
  UseInvokerAccountA: !Not [!Equals [!Ref InvokerAccountIdA, ""]]
  UseInvokerAccountB: !Not [!Equals [!Ref InvokerAccountIdB, ""]]
  HasAnyInvoker: !Or [!Condition UseInvokerAccountA, !Condition UseInvokerAccountB]
  UseBothInvokers: !And [!Condition UseInvokerAccountA, !Condition UseInvokerAccountB]

Resources:

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: charging-stations-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: true
          Mutable: true
      LambdaConfig:
        PostConfirmation:  !GetAtt WriteUserRDSFunction.Arn
        PreSignUp: !GetAtt WriteUserRDSFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: charging-stations-client
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      UserPoolId: !Ref UserPool
      Description: Admin users for console
      Precedence: 1
      
  SupportGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: SUPPORT
      UserPoolId: !Ref UserPool
      Description: Support users
      Precedence: 10

  CommonToolsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/common
      CompatibleRuntimes:
        - python3.13
        - python3.12
      Description: Common tools for Lambdas

  CommonLoggerLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/common
      CompatibleRuntimes:
        - python3.13
        - python3.12
      Description: Common logger for charging-stations Lambdas

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Charging Stations RDS
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for DB operating Lambdas
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
    
  SesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SES
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Charging Stations RDS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  RDSApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.rds"
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref RDSApiEndpointSecurityGroup
      PrivateDnsEnabled: true

  RDSApiEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS API VPC endpoint
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  LambdaApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref LambdaApiEndpointSecurityGroup
      PrivateDnsEnabled: true

  LambdaApiEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda API VPC endpoint
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Attach this managed policy to your ECS/Fargate task role (same account) so the backend can change group membership
  BackendCognitoUserGroupManagementPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AWS::StackName}-backend-cognito-groups
      Description: Fargate/backend API — AdminAddUserToGroup / AdminRemoveUserFromGroup for this User Pool
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CognitoUserPoolGroupManagement
            Effect: Allow
            Action:
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminRemoveUserFromGroup
              - cognito-idp:AdminListGroupsForUser
              - cognito-idp:AdminDisableUser
              - cognito-idp:AdminEnableUser
              - cognito-idp:AdminDeleteUser
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminGetUser
              - cognito-idp:ListGroups
              - cognito-idp:ListUsers
              - cognito-idp:AdminResetUserPassword
              - cognito-idp:AdminUpdateUserAttributes
              - cognito-idp:ChangePassword
              - cognito-idp:ConfirmForgotPassword
              - cognito-idp:ForgotPassword
            Resource: !GetAtt UserPool.Arn

  # Trust matches AWS::Lambda::Permission invoker principals — backend sts:AssumeRole for cognito-idp Admin APIs
  BackendCognitoCrossAccountRole:
    Type: AWS::IAM::Role
    Condition: HasAnyInvoker
    Properties:
      RoleName: !Sub ${AWS::StackName}-cognito-cross-account
      Description: Assumed from invoker account(s) for Cognito user-pool group management
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Fn::If:
                  - UseBothInvokers
                  - - !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
                    - !Sub "arn:aws:iam::${InvokerAccountIdB}:root"
                  - Fn::If:
                      - UseInvokerAccountA
                      - !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
                      - !Sub "arn:aws:iam::${InvokerAccountIdB}:root"
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BackendCognitoUserGroupManagementPolicy

  ChargingStationsRDSPostgresDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: charging-stations-rds-postgres
      Engine: postgres
      EngineVersion: "18.1"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp2
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:password}}"
      DBName: !Ref DBName
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      MultiAZ: false
      PubliclyAccessible: false
      EnableIAMDatabaseAuthentication: true

  # One log group for all app Lambdas → one subscription filter (streams include logStream name to distinguish functions)
  ApplicationSharedLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      RetentionInDays: 30

  ApplicationAuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/charging-stations/${AWS::StackName}/lambda/application/audit"
      RetentionInDays: 30

  WriteUserRDSFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-write-user-rds
      Handler: write_user_rds.handler
      CodeUri: db/write
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Write user to RDS
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"

      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"

  WriteLogsRDSFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationAuditLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Ref ApplicationAuditLogGroup
      FunctionName: charging-stations-write-logs-rds
      Handler: write_logs_rds.handler
      CodeUri: db/write
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Resolve logs in RDS (resolver_id, resolve_time)
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"

  WriteLogsRDSInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref WriteLogsRDSFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  WriteLogsRDSInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref WriteLogsRDSFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  GetLogsInfoFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-read-logs-rds
      Handler: get_logs_info.handler
      CodeUri: db/read
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Get logs from RDS
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"

  GetLogsInfoInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref GetLogsInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  GetLogsInfoInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref GetLogsInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"
  

  GetUserInfoFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-get-user-info
      Handler: get_user_info.handler
      CodeUri: db/read
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Get user info from RDS
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"

  GetUserInfoInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref GetUserInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
      
  GetUserInfoInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref GetUserInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  CreateRDSTablesFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ChargingStationsRDSPostgresDB
      - ApplicationSharedLambdaLogGroup
    Properties:
      Timeout: 30
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-create-rds-tables
      Handler: create_rds_tables.handler
      CodeUri: db
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Create RDS tables
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
  # Cross-account: only when InvokerAccountId is provided
  CreateRDSTablesInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref CreateRDSTablesFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
      
  CreateRDSTablesInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref CreateRDSTablesFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  WriteUserRDSInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref WriteUserRDSFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
      
  WriteUserRDSInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref WriteUserRDSFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  CognitoInvokeWriteUserRDSPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WriteUserRDSFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  ConfirmConsoleCreatedAdminFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApplicationSharedLambdaLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-confirm-console-created-admin
      Handler: confirm_console_created_admin.handler
      CodeUri: db
      Layers:
        - !Ref CommonLoggerLayer
      Description: Confirm console created admin
      Environment:
        Variables:
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_REGION: !Ref AWS::Region
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
              Resource: !GetAtt UserPool.Arn

  ConfirmConsoleCreatedAdminInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref ConfirmConsoleCreatedAdminFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
      
  ConfirmConsoleCreatedAdminInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref ConfirmConsoleCreatedAdminFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"
      
  HealthFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApplicationSharedLambdaLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-health
      Handler: app.handler
      CodeUri: routes/health
      Environment:
        Variables:
          DYNAMO_WRITE_LAMBDA: !Ref WriteStationPortsFunction
          AWS_LAMBDA_HOST_ACCOUNT: !Ref AWS::AccountId
      Layers:
        - !Ref CommonLoggerLayer
      Description: Health check - returns {"code":200,"status":"running"}
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:charging-stations-write-station-ports-dynamo"

  # Cross-account: only when InvokerAccountId is provided
  HealthInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref HealthFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
      
  HealthInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref HealthFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"
  
  WriteStationRDSFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-write-station-rds
      Handler: write_station_rds.handler
      CodeUri: db/write
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Write station to RDS
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
          GET_PORTS_SESSIONS_FUNCTION_NAME: !Ref GetPortsSessionsFunction
          AWS_LAMBDA_HOST_ACCOUNT: !Ref AWS::AccountId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt GetPortsSessionsFunction.Arn
  
  WriteStationRDSInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref WriteStationRDSFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
  
  WriteStationRDSInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref WriteStationRDSFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"
  
  GetStationInfoFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-get-station-info
      Handler: get_station_info.handler
      CodeUri: db/read
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Get station info from RDS
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"

  GetStationInfoInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref GetStationInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  GetStationInfoInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref GetStationInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"
  
  # Single-table design: ports + future sessions
  StationEntitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: charging-stations-station-entities
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: exp_time
        Enabled: true
      AttributeDefinitions:
        - AttributeName: station_id
          AttributeType: S
        - AttributeName: entity_key
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: state
          AttributeType: S
        - AttributeName: time_booked_before
          AttributeType: S
      KeySchema:
        - AttributeName: station_id
          KeyType: HASH
        - AttributeName: entity_key
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user_id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: state-station-index
          KeySchema:
            - AttributeName: state
              KeyType: HASH
            - AttributeName: station_id
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - entity_key
              - updated_at
              - tariff
              - energy_consumed_kwh
              - time_booked_at
              - started_at
              - stopped_at
              - charge_level_percent
              - user_id
        - IndexName: booking-state-time-index
          KeySchema:
            - AttributeName: state
              KeyType: HASH
            - AttributeName: time_booked_before
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - station_id
              - entity_key
              - user_id
      SSESpecification:
        SSEEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  
  CheckBookingsFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApplicationSharedLambdaLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-check-bookings
      Handler: check_bookings.handler
      CodeUri: db/maintenance
      Layers:
        - !Ref CommonToolsLayer
      Description: Checks expired BOOKED sessions and releases booked ports
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          STATIONS_DYNAMO_TABLE: !Ref StationEntitiesTable
          WRITE_PORTS_FUNCTION_NAME: !Ref WriteStationPortsFunction
          BOOKING_TIME_INDEX_NAME: booking-state-time-index
          MAX_WORKERS: "10"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${StationEntitiesTable.Arn}/index/booking-state-time-index"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt WriteStationPortsFunction.Arn
      Events:
        CheckBookingsSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  ChargeSimPriceCalcFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApplicationSharedLambdaLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-charge-sim-price-calc
      Handler: charge_sim_price_calc.handler
      CodeUri: db/maintenance
      Layers:
        - !Ref CommonToolsLayer
      Description: Recalculates BOOKED/ACTIVE session costs and charging simulation
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          STATIONS_DYNAMO_TABLE: !Ref StationEntitiesTable
          SESSION_STATE_INDEX_NAME: state-station-index
          BOOKING_TIMEOUT_MINUTES: !Ref BookingTimeoutMinutes
          NOTIFICATION_LAMBDA_FUNCTION_NAME: !Ref PaymentNotificationFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !Sub "${StationEntitiesTable.Arn}/index/state-station-index"
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt StationEntitiesTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:charging-stations-payment-notification"
      Events:
        ChargeSimPriceCalcSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)   # or 5 minutes
            Enabled: true
      
  # Allows private-subnet Lambdas to reach DynamoDB via gateway endpoint (no NAT required)
  DynamoDBGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      RouteTableIds:
        - !Ref DynamoDBRouteTable1Id

  SesApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.email"
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id
      SecurityGroupIds:
        - !Ref SesSecurityGroup
      PrivateDnsEnabled: true

  PaymentNotificationFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ChargingStationsRDSPostgresDB
      - ApplicationSharedLambdaLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-payment-notification
      Handler: notification.handler
      CodeUri: notification
      Layers:
        - !Ref CommonToolsLayer
      Description: Sends notifications via SES
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          GET_USER_FUNCTION_NAME: !Ref GetUserInfoFunction
          AWS_LAMBDA_HOST_ACCOUNT: !Ref AWS::AccountId
          SES_FROM_EMAIL: !Ref SesFromEmail
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: 
                - !GetAtt GetUserInfoFunction.Arn

  PaymentNotificationInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref PaymentNotificationFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  PaymentNotificationInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref PaymentNotificationFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  WriteStationPortsFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - DynamoDBGatewayEndpoint
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-write-station-ports-dynamo
      Handler: write_ports_sessions_dynamo.handler
      CodeUri: db/write
      Layers:
        - !Ref CommonToolsLayer
      Description: Support writes station ports into DynamoDB (single-table)
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          STATIONS_DYNAMO_TABLE: !Ref StationEntitiesTable
          AWS_LAMBDA_HOST_ACCOUNT: !Ref AWS::AccountId
          GET_STATION_FUNCTION_NAME: !Ref GetStationInfoFunction
          BOOKING_TIMEOUT_MINUTES: !Ref BookingTimeoutMinutes
          GET_PORTS_SESSIONS_FUNCTION_NAME: !Ref GetPortsSessionsFunction
          PAYMENT_SUCCESS_RATE: "80" # 80% chance of successful payment
          PORT_UPDATE_SUCCESS_RATE: "80" # 80% chance of successful port update
          WRITE_STATION_RDS_FUNCTION_NAME: !Ref WriteStationRDSFunction
          NOTIFICATION_LAMBDA_FUNCTION_NAME: !Ref PaymentNotificationFunction
          EXPIRATION_TIME_SECONDS_HEALTH_CHECK_SECONDS: 10 # 10 seconds
          EXPIRATION_TIME_PAID_SESSION_SECONDS: 86400 # 24 hours
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:BatchWriteItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt StationEntitiesTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: 
                - !GetAtt GetStationInfoFunction.Arn
                - !GetAtt GetPortsSessionsFunction.Arn
                - !GetAtt PaymentNotificationFunction.Arn
    
  WriteStationPortsInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref WriteStationPortsFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  WriteStationPortsInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref WriteStationPortsFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  StationEntitiesStreamConsumerFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - StationEntitiesTable
      - DynamoDBGatewayEndpoint
      - LambdaApiVpcEndpoint
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-station-entities-stream-consumer
      Handler: stations_dynamo_stream_consumer.handler
      CodeUri: db/read
      Layers:
        - !Ref CommonToolsLayer
      Environment:
        Variables:
          WRITE_STATION_FUNCTION_NAME: charging-stations-write-station-rds
          AWS_LAMBDA_HOST_ACCOUNT: !Ref AWS::AccountId
          WRITE_SESSION_FUNCTION_NAME: charging-stations-write-station-ports-dynamo
          WRITE_STATION_RDS_FUNCTION_NAME: !Ref WriteStationRDSFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: 
                - !GetAtt WriteStationRDSFunction.Arn
                - !GetAtt WriteStationPortsFunction.Arn
      Description: Consumes DynamoDB stream records from station entities table
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Events:
        StationEntitiesStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt StationEntitiesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            Enabled: true

  GetSessionInfoFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-get-session-info
      Handler: get_session_rds_info.handler
      CodeUri: db/read
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Get archived session info from RDS
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"

  GetSessionInfoInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref GetSessionInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  GetSessionInfoInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref GetSessionInfoFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  GetPortsSessionsFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - DynamoDBGatewayEndpoint
      - ApplicationSharedLambdaLogGroup
    Properties:
      Runtime: python3.12
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-get-ports-sessions-dynamo
      Handler: get_ports_sessions_dynamo.handler
      CodeUri: db/read
      Layers:
        - !Ref CommonToolsLayer
      Description: Read station ports from DynamoDB single-table (filters out session rows)
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          STATIONS_DYNAMO_TABLE: !Ref StationEntitiesTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: 
                - !GetAtt StationEntitiesTable.Arn
                - !Sub "${StationEntitiesTable.Arn}/index/*"

  GetPortsSessionsInvokePermissionA:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountA
    Properties:
      FunctionName: !Ref GetPortsSessionsFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  GetPortsSessionsInvokePermissionB:
    Type: AWS::Lambda::Permission
    Condition: UseInvokerAccountB
    Properties:
      FunctionName: !Ref GetPortsSessionsFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdB}:root"

  ReconcileFreePortsFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - DynamoDBGatewayEndpoint
      - ApplicationSharedLambdaLogGroup
    Properties:
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-reconcile-free-ports
      Handler: reconcile_free_ports.handler
      CodeUri: db/maintenance
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Description: Reconciles stations.has_free_ports between DynamoDB port states and RDS
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id
      Environment:
        Variables:
          STATIONS_DYNAMO_TABLE: !Ref StationEntitiesTable
          FREE_PORTS_GSI_NAME: state-station-index
          DB_HOST: !GetAtt ChargingStationsRDSPostgresDB.Endpoint.Address
          DB_PORT: "5432"
          DB_NAME: !Ref DBName
          DB_USER: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt StationEntitiesTable.Arn
                - !Sub "${StationEntitiesTable.Arn}/index/state-station-index"
            - Effect: Allow
              Action: rds-db:connect
              Resource: !Sub
                - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DBResourceId}/${DBUser}"
                - DBResourceId: !GetAtt ChargingStationsRDSPostgresDB.DbiResourceId
                  DBUser: !Sub "{{resolve:secretsmanager:${DBSecretArn}:SecretString:username}}"
      Events:
        ReconcileFreePortsSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

  # Receives ERROR/CRITICAL-shaped audit JSON from the shared app log group
  LogSubscriptionProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: charging-stations-log-subscription-processor
      Handler: log_sub_processor.handler
      CodeUri: db/maintenance
      LoggingConfig:
        LogGroup: !Ref ApplicationAuditLogGroup
      Description: CloudWatch Logs subscription target for high-severity audit lines
      Timeout: 60
      MemorySize: 256
      Layers:
        - !Ref CommonToolsLayer
        - !Sub "arn:aws:lambda:${AWS::Region}:770693421928:layer:Klayers-p312-psycopg2-binary:2"
      Environment:
        Variables:
          WRITE_LOGS_RDS_FUNCTION_NAME: !Ref WriteLogsRDSFunction
          AWS_LAMBDA_HOST_ACCOUNT: !Ref AWS::AccountId
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt WriteLogsRDSFunction.Arn

  LogSubscriptionPermApplicationShared:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LogSubscriptionProcessorFunction
      Action: lambda:InvokeFunction
      Principal: logs.amazonaws.com
      SourceArn: !Sub 
        "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ApplicationSharedLambdaLogGroup}:*"

  AllowSourceRouterInvokeLogSubscriptionProcessor:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LogSubscriptionProcessorFunction
      Action: lambda:InvokeFunction
      Principal: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"

  LogSubscriptionLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !GetAtt LogSubscriptionProcessorFunction.Arn
      Principal: logs.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  AuditLogSubscriptionApplicationSharedA:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: 
      - LogSubscriptionPermApplicationShared
    Properties:
      LogGroupName: !Ref ApplicationSharedLambdaLogGroup
      FilterName: audit-high-severity-ERROR
      FilterPattern: '"\"level\": \"ERROR\"" "\"service\": "'
      DestinationArn: !GetAtt LogSubscriptionProcessorFunction.Arn

  AuditLogSubscriptionApplicationSharedB:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: 
      - LogSubscriptionPermApplicationShared
    Properties:
      LogGroupName: !Ref ApplicationSharedLambdaLogGroup
      FilterName: audit-high-severity-CRITICAL
      FilterPattern: '"\"level\": \"CRITICAL\"" "\"service\": "'
      DestinationArn: !GetAtt LogSubscriptionProcessorFunction.Arn
  
  CommandQueueDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-command-dlq.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 1209600 # 14 days

  CommandQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-command.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 20
      MessageRetentionPeriod: 345600 # 4 days
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CommandQueueDlq.Arn
        maxReceiveCount: 3

  CommandQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CommandQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBackendAccountASend
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${InvokerAccountIdA}:root"
            Action:
              - sqs:SendMessage
            Resource: !GetAtt CommandQueue.Arn
            Condition:
              StringNotEquals:
                aws:PrincipalAccount: ""

  CommandRouterFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ApplicationSharedLambdaLogGroup
      - CommandQueue
    Properties:
      Runtime: python3.13
      LoggingConfig:
        LogGroup: !Sub "/charging-stations/${AWS::StackName}/lambda/application"
      FunctionName: charging-stations-command-router
      Handler: command_handler.handler
      CodeUri: routes
      Layers:
        - !Ref CommonToolsLayer
      Description: Routes backend command messages from SQS to target lambdas
      Timeout: 15
      Environment:
        Variables:
          AWS_LAMBDA_HOST_ACCOUNT: !Ref AWS::AccountId
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:charging-stations-*"
      Events:
        CommandQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CommandQueue.Arn
            BatchSize: 10
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
  
Outputs:
  UserPoolId:
    Description: Cognito User Pool ID (backend API / Fargate env)
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId
  UserPoolArn:
    Description: Cognito User Pool ARN (IAM Resource for cognito-idp policies)
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolArn
  UserPoolClientId:
    Description: Cognito app client ID for user-auth flows from backend
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId
  BackendCognitoUserGroupManagementPolicyArn:
    Description: Attach this managed policy to the Fargate/ECS task role that calls Cognito Admin group APIs
    Value: !Ref BackendCognitoUserGroupManagementPolicy
    Export:
      Name: !Sub ${AWS::StackName}-BackendCognitoGroupPolicyArn
  CognitoCrossAccountRoleArn:
    Condition: HasAnyInvoker
    Description: Backend sets CognitoCrossAccountRoleArn to this — sts:AssumeRole from invoker account(s) (same principals as Lambda invoke)
    Value: !GetAtt BackendCognitoCrossAccountRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CognitoCrossAccountRoleArn
  LogSubscriptionProcessorFunctionArn:
    Description: ARN of the log subscription processor (cross-account subscription DestinationArn in the backend account)
    Value: !GetAtt LogSubscriptionProcessorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LogSubscriptionProcessorFunctionArn
  CommandQueueUrl:
    Description: FIFO command queue URL for backend producers
    Value: !Ref CommandQueue
    Export:
      Name: !Sub "${AWS::StackName}-CommandQueueUrl"
  CommandQueueArn:
    Description: FIFO command queue ARN for IAM policies
    Value: !GetAtt CommandQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CommandQueueArn"
  CommandQueueDlqArn:
    Description: FIFO command DLQ ARN
    Value: !GetAtt CommandQueueDlq.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CommandQueueDlqArn"

  