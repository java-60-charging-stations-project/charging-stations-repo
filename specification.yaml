openapi: 3.0.1
info:
  title: EV Charging Public API
  version: 1.0.0
  description: Public API for electric vehicle charging stations.

servers:
  - url: https://localhost:8000

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        '200':
          description: "Application is running"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /welcome:
    get:
      operationId: listWelcomePageData
      summary: Get list of all active charging stations for the welcome page (unauthenticated)
      description: Returns all public data about active charging stations.
      parameters:
        - name: city
          in: query
          description: City name
          required: false
          schema:
            type: string
            example: Tel Aviv
        - name: provider
          in: query
          description: Service provider (station owner) code
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of active charging stations data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseCollectionResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /stations:
    get:
      operationId: listStations
      summary: Get list of charging stations
      description: Returns a list of charging stations data
      parameters:
        - name: city
          in: query
          description: City name prefix filter (wildcard search, e.g. "Tel" matches "Tel Aviv")
          required: false
          schema:
            type: string
        - name: owner
          in: query
          description: Station owner prefix filter (wildcard search)
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: Station state filter (exact match)
          required: false
          schema:
            type: string
            enum: [Inactive, Active, OutOfService]
        - name: orderBy
          in: query
          required: false
          description: >
            Comma-separated list of sort tokens. Allowed tokens: name+ (name asc), name- (name desc),
            owner+ (owner asc), owner- (owner desc). Results are always additionally sorted by id asc
            as the final condition.
          schema:
            type: string
            example: "name+,owner-"
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of charging stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseCollectionResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /stations/{stationId}:
    get:
      operationId: getStationById
      summary: Get charging station by ID
      description: Returns a single charging station by its ID.
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      responses:
        '200':
          description: Charging station data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/stations:
    get:
      operationId: listAdminStations
      summary: Get list of charging stations as admin
      description: Returns a paginated list of charging stations. Requires admin privileges.
      x-roles: [ADMIN]
      parameters:
        - name: city
          in: query
          required: false
          description: City name prefix filter (wildcard search, e.g. "Tel" matches "Tel Aviv")
          schema:
            type: string
        - name: owner
          in: query
          required: false
          description: Station owner prefix filter (wildcard search)
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Station state filter (exact match)
          schema:
            type: string
            enum: [Inactive, Active, OutOfService]
        - name: orderBy
          in: query
          required: false
          description: >
            Comma-separated list of sort tokens. Allowed tokens: name+ (name asc), name- (name desc),
            owner+ (owner asc), owner- (owner desc). Results are always additionally sorted by id asc
            as the final condition.
          schema:
            type: string
            example: "name+,owner-"
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of charging stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseCollectionResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    post:
      operationId: createAdminStation
      summary: Create charging station as admin
      description: Creates a new charging station. Requires admin privileges.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateStationRequest'
            example:
              code: TLV-FAST-904
              name: Skyline Hub
              owner: ElectroNet Services Ltd.
              city: Tel Aviv
              address: 44 Ibn Gabirol St
              ratePlan:
                peakRate: 2.14
                offPeakRate: 1.47
              location:
                latitude: 37.419734
                longitude: -122.0827784
              siteTechnician: null
              phone: null
              email: null
              maxPowerKw: null
      responses:
        '201':
          description: Charging station created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'
              example:
                data:
                  id: st-001
                  code: TLV-FAST-904
                  name: Skyline Hub
                  owner: ElectroNet Services Ltd.
                  city: Tel Aviv
                  address: 44 Ibn Gabirol St
                  ratePlan:
                    peakRate: 2.14
                    offPeakRate: 1.47
                  location:
                    latitude: 37.419734
                    longitude: -122.0827784
                  siteTechnician: Station technician
                  phone: null
                  email: null
                  maxPowerKw: null
                  state: Active
                  createdAt: "2026-03-18T14:19:07+02:00"
                  updatedAt: "2026-03-18T14:19:07+02:00"
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /admin/stations/{stationId}:
    get:
      operationId: getAdminStationById
      summary: Get charging station by ID as admin
      description: Returns a single charging station by its ID. Requires admin privileges.
      x-roles: [ADMIN]
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      responses:
        '200':
          description: Charging station data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'
              example:
                data:
                  id: stn-d6f9c102
                  code: TLV-FAST-904
                  name: Skyline Hub
                  owner: ElectroNet Services Ltd.
                  city: Tel Aviv
                  address: 44 Ibn Gabirol St
                  phone: null
                  email: null
                  siteTechnician: Station technician
                  maxPowerKw: null
                  location:
                    latitude: 37.419734
                    longitude: -122.0827784
                  state: Active
                  ratePlan:
                    peakRate: 2.14
                    offPeakRate: 1.47
                  createdAt: "2026-03-18T14:19:07+02:00"
                  updatedAt: "2026-03-18T14:19:07+02:00"
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'
    delete:
      operationId: deleteAdminStation
      summary: Delete charging station as admin
      description: Deletes a charging station. Requires admin privileges. The station can only be deleted when it is in a deletable state.
      x-roles: [ADMIN]
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      responses:
        '204':
          description: Charging station deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /admin/stations/{stationId}/state:
    patch:
      operationId: updateAdminStationState
      summary: Change charging station state as admin
      description: Changes the state of a charging station. Requires admin privileges. The updatedAt field must match the server value to prevent concurrent modification conflicts.
      x-roles: [ADMIN]
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStationStateRequest'
      responses:
        '200':
          description: Charging station state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /sessions:
    post:
      operationId: createSession
      summary: Start a charging session
      description: Creates a new charging session for the given station, port, and user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '200':
          description: Session started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreatedResponse'
        '400':
          description: Wrong statuses of station or port
          $ref: '#/components/responses/ErrorResponse'
        '404':
          description: Wrong stationId or portId
          $ref: '#/components/responses/ErrorResponse'
        '409':
          description: Port is occupied
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /sessions/{sessionId}/stop:
    post:
      operationId: stopSession
      summary: Stop a charging session
      description: Stops an active charging session and returns the session summary.
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session identifier
          schema:
            type: string
      responses:
        '200':
          description: Session stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStoppedResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Get current session
      responses:
        '200':
          description: Current charging session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSingleResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /sessions/history/{sessionId}:
    get:
      operationId: getSessionById
      summary: Get session history item by ID
      description: Returns a single user charging session from history by its ID.
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session history identifier
          schema:
            type: string
      responses:
        '200':
          description: Session history item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistorySingleResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /sessions/history:
    get:
      operationId: listSessionHistory
      summary: Get user charging sessions history
      description: Returns user charging sessions during the specified period.
      parameters:
        - name: userId
          in: query
          required: true
          description: User identifier
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          description: Start date for history period
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: End date for history period (if omitted, defaults to current date/time)
          schema:
            type: string
            format: date
        - name: stationId
          in: query
          required: false
          description: Filter by station identifier
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: User charging sessions history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryCollectionResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /account/profile:
    get:
      operationId: getProfile
      summary: Get user profile
      description: Returns user profile by ID.
      parameters:
        - name: userId
          in: query
          required: true
          description: User identifier
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSingleResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /account/settings:
    get:
      operationId: getSettings
      summary: Get user settings
      description: Returns user account settings.
      parameters:
        - name: userId
          in: query
          required: true
          description: User identifier
          schema:
            type: string
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSingleResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /account/stats:
    get:
      operationId: getStats
      summary: Get user charging stats
      description: Returns user charging statistics.
      parameters:
        - name: userId
          in: query
          required: true
          description: User identifier
          schema:
            type: string
      responses:
        '200':
          description: User stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSingleResponse'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user
      description: Returns the profile of the currently authenticated user.
      responses:
        '200':
          description: Current user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'

        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'

        '404':
          $ref: '#/components/responses/UserNotFoundResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /support/stations:
    get:
      operationId: listSupportStations
      summary: Get list of support stations
      description: Returns support station information filtered by city and provider.
      parameters:
        - name: city
          in: query
          required: false
          description: City name prefix filter (wildcard search, e.g. "Tel" matches "Tel Aviv")
          schema:
            type: string
        - name: owner
          in: query
          required: false
          description: Station owner prefix filter (wildcard search)
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Station state filter (exact match)
          schema:
            type: string
            enum: [Inactive, Active, OutOfService]
        - name: orderBy
          in: query
          required: false
          description: >
            Comma-separated list of sort tokens. Allowed tokens: name+ (name asc), name- (name desc),
            owner+ (owner asc), owner- (owner desc). Results are always additionally sorted by id asc
            as the final condition.
          schema:
            type: string
            example: "name+,owner-"
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of support stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseCollectionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /support/stations/{stationId}:
    get:
      operationId: getSupportStationById
      summary: Get support station by ID
      description: Returns support station information for a charging station.
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      responses:
        '200':
          description: Support station details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /support/stations/{stationId}/state:
    patch:
      operationId: updateSupportStationState
      summary: Change charging station state as support
      description: Changes the state of a charging station. Requires technical support privileges. The updatedAt field must match the server value to prevent concurrent modification conflicts.
      x-roles: [TECH_SUPPORT]
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStationStateRequest'
      responses:
        '200':
          description: Charging station state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /support/sessions:
    get:
      operationId: listSupportSessions
      summary: Get support sessions
      description: Returns support session details filtered by various criteria.
      parameters:
        - name: stationId
          in: query
          required: false
          description: Station identifier
          schema:
            type: string
        - name: portId
          in: query
          required: false
          description: Port identifier
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Session status filter
          schema:
            type: string
            enum: [preparing, charging, paused, completed, faulted, error]
        - name: startedAtFrom
          in: query
          required: false
          description: Start date filter (session started at or after)
          schema:
            type: string
            format: date-time
        - name: startedAtTo
          in: query
          required: false
          description: End date filter (session started at or before)
          schema:
            type: string
            format: date-time
        - name: endedAtFrom
          in: query
          required: false
          description: Start date filter (session ended at or after)
          schema:
            type: string
            format: date-time
        - name: endedAtTo
          in: query
          required: false
          description: End date filter (session ended at or before)
          schema:
            type: string
            format: date-time
        - name: userInitiated
          in: query
          required: false
          description: Filter by whether session was user-initiated
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of support sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailedCollectionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /support/logs:
    get:
      operationId: listSupportLogs
      summary: Get support logs
      description: Returns support logs filtered by station, port, and date range.
      parameters:
        - name: stationId
          in: query
          required: false
          description: Station identifier
          schema:
            type: string
        - name: portId
          in: query
          required: false
          description: Port identifier
          schema:
            type: string
        - name: dateFrom
          in: query
          required: true
          description: Start date for log period
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: true
          description: End date for log period
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of support logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportLogCollectionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users:
    get:
      operationId: listUsers
      summary: List users
      description: Returns users from Cognito with cursor-based pagination. Requires admin privileges.
      x-roles: [ADMIN]
      parameters:
        - name: limit
          in: query
          required: true
          description: Maximum number of users to return.
          schema:
            type: integer
            minimum: 1
        - name: paginationToken
          in: query
          required: false
          description: Cursor token from a previous list call for the next page.
          schema:
            type: string
        - name: filterKey
          in: query
          required: false
          description: Optional filter key. Must be sent together with filterValue.
          schema:
            type: string
            enum: [email, name]
        - name: filterValue
          in: query
          required: false
          description: Optional filter value. Must be sent together with filterKey.
          schema:
            type: string
      responses:
        '200':
          description: Users page returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersListResponse'

        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users/{userId}:
    get:
      operationId: getUserById
      summary: Get user by ID
      description: Returns a single Cognito user with role information. Requires admin privileges.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '200':
          description: User details returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteUser
      summary: Delete user
      description: Deletes a Cognito user account. Admins cannot delete their own account.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users/{userId}/role:
    patch:
      operationId: changeUserRole
      summary: Change user role
      description: Changes a user's role via Cognito groups. The request must provide both oldRole and newRole, and they must differ. Admins cannot modify their own role.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '204':
          description: Role changed successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users/{userId}/enable:
    patch:
      operationId: enableUser
      summary: Enable user
      description: Enables a Cognito user account. Admins cannot enable their own account.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '204':
          description: User enabled successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users/{userId}/disable:
    patch:
      operationId: disableUser
      summary: Disable user
      description: Disables a Cognito user account. Admins cannot disable their own account.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '204':
          description: User disabled successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

components:

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Meta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: Internal server error

    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    Port:
      type: object
      required: [id, number, status]
      properties:
        id:
          type: string
        number:
          type: integer
        status:
          type: string

    RatePlan:
      type: object
      required: [peakRate, offPeakRate]
      properties:
        peakRate:
          type: number
          format: float
        offPeakRate:
          type: number
          format: float

    StationBase:
      type: object
      required:
        - id
        - code
        - name
        - owner
        - city
        - address
        - ratePlan
        - location
        - siteTechnician
        - phone
        - email
        - maxPowerKw
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        code:
          type: string
          description: Unique station code.
        name:
          type: string
        owner:
          type: string
        city:
          type: string
        address:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        siteTechnician:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        maxPowerKw:
          type: string
          nullable: true
        state:
          type: string
          enum: [Inactive, Active, OutOfService]
        ratePlan:
          $ref: '#/components/schemas/RatePlan'
        createdAt:
          type: string
          format: date-time
          example: "2026-02-18T09:30:45+02:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-18T11:07:12Z"
      example:
        id: stn-8f2a9b31
        code: HA-DC-0018
        name: Riverside Fast Charge
        owner: GreenVolt Operations Ltd.
        city: Haifa
        address: 18 Hanamal St
        phone: null
        email: null
        siteTechnician: Station technician
        maxPowerKw: null
        location:
          latitude: 37.419734
          longitude: -122.0827784
        state: Active
        ratePlan:
          peakRate: 1.92
          offPeakRate: 1.34
        createdAt: "2025-11-04T07:16:28+02:00"
        updatedAt: "2026-03-18T10:41:03Z"

    StationDetailed:
      allOf:
        - $ref: '#/components/schemas/StationBase'
        - type: object
          properties:
            location:
              $ref: '#/components/schemas/Location'
            portCount:
              type: integer
            ports:
              type: array
              items:
                $ref: '#/components/schemas/Port'

    StationBaseSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StationBase'

    StationBaseCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StationBase'
        meta:
          $ref: '#/components/schemas/Meta'

    StationDetailedSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StationDetailed'

    StationDetailedCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StationDetailed'
        meta:
          $ref: '#/components/schemas/Meta'

    AdminCreateStationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StationBase'

    AdminCreateStationRequest:
      type: object
      required:
        - code
        - name
        - owner
        - city
        - address
        - ratePlan
        - location
        - siteTechnician
        - phone
        - email
        - maxPowerKw
      properties:
        code:
          type: string
          description: Unique station code.
        name:
          type: string
        owner:
          type: string
        city:
          type: string
        address:
          type: string
        ratePlan:
          $ref: '#/components/schemas/RatePlan'
        location:
          $ref: '#/components/schemas/Location'
        siteTechnician:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        maxPowerKw:
          type: string
          nullable: true

    UpdateStationStateRequest:
      type: object
      required: [oldState, newState, updatedAt]
      properties:
        oldState:
          type: string
          enum: [Inactive, Active, OutOfService]
        newState:
          type: string
          enum: [Inactive, Active, OutOfService]
        updatedAt:
          type: string
          format: date-time
          description: Last known updatedAt value for optimistic concurrency control

    Session:
      type: object
      required:
        - id
        - stationId
        - status
        - startedAt
        - durationMinutes
        - chargeLevelPercent
        - energyConsumedKWh
        - maxPowerKw
        - pricePerKWh
        - currentCost
        - currency
        - estimatedMinutesRemaining
      properties:
        id:
          type: string
        stationId:
          type: string
        status:
          type: string
          enum: [preparing, charging, paused, completed, faulted, error]
        startedAt:
          type: string
          format: date-time
          example: '2026-03-04T09:00:00Z'
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
        chargeLevelPercent:
          type: integer
        energyConsumedKWh:
          type: number
          format: float
          example: 18.4
        maxPowerKw:
          type: integer
        pricePerKWh:
          type: number
          format: float
          example: 1.50
        currentCost:
          type: number
          format: float
          example: 27.60
        currency:
          type: string
          example: ILS
        estimatedMinutesRemaining:
          type: integer
          example: 25

    SessionSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Session'

    SessionDetailedItem:
      type: object
      required:
        - id
        - stationId
        - status
        - startedAt
        - durationMinutes
        - chargeLevelPercent
        - energyConsumedKWh
        - maxPowerKw
        - pricePerKWh
        - currentCost
        - currency
        - portId
        - userId
      properties:
        id:
          type: string
        stationId:
          type: string
        portId:
          type: string
        status:
          type: string
          enum: [preparing, charging, paused, completed, faulted, error]
        startedAt:
          type: string
          format: date-time
          example: '2026-03-04T09:00:00Z'
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
        chargeLevelPercent:
          type: integer
        energyConsumedKWh:
          type: number
          format: float
        maxPowerKw:
          type: integer
        pricePerKWh:
          type: number
          format: float
        currentCost:
          type: number
          format: float
        currency:
          type: string
        userId:
          type: string
          description: User who initiated the session

    SessionDetailedCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionDetailedItem'
        meta:
          $ref: '#/components/schemas/Meta'

    StartSessionRequest:
      type: object
      required: [stationId, portId, userId]
      properties:
        stationId:
          type: string
        portId:
          type: string
        userId:
          type: string

    SessionCreated:
      type: object
      required: [id, status, startedAt, currency, pricePerKWh]
      properties:
        id:
          type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        currency:
          type: string
        pricePerKWh:
          type: number
          format: float

    SessionCreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionCreated'

    SessionStopped:
      type: object
      required: [id, status, endedAt, totalDurationMinutes, energyConsumedKWh, totalCost, currency]
      properties:
        id:
          type: string
        status:
          type: string
          example: completed
        endedAt:
          type: string
          format: date-time
        totalDurationMinutes:
          type: integer
        energyConsumedKWh:
          type: number
          format: float
        totalCost:
          type: number
          format: float
        currency:
          type: string

    SessionStoppedResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionStopped'

    SessionHistoryItem:
      type: object
      required:
        - id
        - stationId
        - startedAt
        - endedAt
        - totalDurationMinutes
        - energyConsumedKWh
        - pricePerKWh
        - totalCost
        - currency
      properties:
        id:
          type: string
        stationId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        totalDurationMinutes:
          type: integer
        energyConsumedKWh:
          type: number
          format: float
        pricePerKWh:
          type: number
          format: float
        totalCost:
          type: number
          format: float
        currency:
          type: string

    SessionHistoryCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionHistoryItem'
        meta:
          $ref: '#/components/schemas/Meta'

    SessionHistorySingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SessionHistoryItem'

    Profile:
      type: object
      required: [userId, email, firstName, lastName, phone, role, createdAt, lastLoginAt]
      properties:
        userId:
          type: string
          example: usr-123
        email:
          type: string
          example: user@example.com
        firstName:
          type: string
          example: Dana
        lastName:
          type: string
          example: Levi
        phone:
          type: string
          example: "+972501234567"
        role:
          type: string
          enum: [USER, TECH_SUPPORT, ADMIN]
        createdAt:
          type: string
          format: date-time
          example: "2025-10-01T08:20:00Z"
        lastLoginAt:
          type: string
          format: date-time
          example: "2026-03-04T09:41:00Z"

    ProfileSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Profile'

    Settings:
      type: object
      required: [language, timezone, currency, notifications, theme]
      properties:
        language:
          type: string
          example: en
        timezone:
          type: string
          example: Asia/Jerusalem
        currency:
          type: string
          example: ILS
        notifications:
          type: string
          enum: [on, off]
        theme:
          type: string
          enum: [dark, light]

    SettingsSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Settings'

    Stats:
      type: object
      required: [totalSessions, totalEnergyKWh, totalSpent, avgSpent, favoriteStationId]
      properties:
        totalSessions:
          type: integer
        totalEnergyKWh:
          type: number
          format: float
        totalSpent:
          type: number
          format: float
        avgSpent:
          type: number
          format: float
        currency:
          type: string
          example: ILS
        favoriteStationId:
          type: string

    StatsSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Stats'

    SupportLogItem:
      type: object
      required: [stationId, portId, dateTime, logMessage]
      properties:
        stationId:
          type: string
        portId:
          type: string
        dateTime:
          type: string
          format: date-time
        logMessage:
          type: string

    SupportLogCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SupportLogItem'
        meta:
          $ref: '#/components/schemas/Meta'

    User:
      type: object
      required:
        - userId
        - email
        - role
        - fullName
        - phone
        - status
        - createdAt
        - updatedAt
      properties:
        userId:
          type: string
          example: usr-123
        email:
          type: string
          example: user@example.com
        role:
          type: string
          enum: [USER, TECH_SUPPORT, ADMIN]
        fullName:
          type: string
          example: Dana Levi
        phone:
          type: string
          example: "+972501234567"
        status:
          type: string
          enum: [active, blocked]
        createdAt:
          type: string
          format: date-time
          example: "2025-10-01T08:20:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-04T09:41:00Z"

    UserSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    UserCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'

    UserRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [USER, TECH_SUPPORT, ADMIN]

    UserRoleSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UserRole'

    AdminUserRole:
      type: string
      enum: [ADMIN, USER, SUPPORT]

    AdminUser:
      type: object
      required:
        - userId
        - email
        - name
        - createDate
        - lastModifiedDate
        - enabled
        - status
        - role
      properties:
        userId:
          type: string
        email:
          type: string
        name:
          type: string
        createDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time
        enabled:
          type: boolean
        status:
          type: string
        role:
          $ref: '#/components/schemas/AdminUserRole'

    AdminUserSummary:
      type: object
      required:
        - userId
        - email
        - name
        - createDate
        - lastModifiedDate
        - enabled
        - status
      properties:
        userId:
          type: string
        email:
          type: string
        name:
          type: string
        createDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time
        enabled:
          type: boolean
        status:
          type: string

    AdminUserSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminUser'

    AdminUsersListPayload:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserSummary'
        paginationToken:
          type: string
          nullable: true

    AdminUsersListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdminUsersListPayload'

    UpdateUserRoleRequest:
      type: object
      required: [oldRole, newRole]
      properties:
        oldRole:
          $ref: '#/components/schemas/AdminUserRole'
        newRole:
          $ref: '#/components/schemas/AdminUserRole'

    UpdateUserEnabledRequest:
      type: object
      required: [email, updatedAt]
      properties:
        email:
          type: string
          format: email
        updatedAt:
          type: string
          format: date-time
          description: Last known updatedAt value for optimistic concurrency control

    UpdateUserStatusRequest:
      type: object
      required: [status, updatedAt]
      properties:
        status:
          type: string
          enum: [active, blocked]
        updatedAt:
          type: string
          format: date-time
          description: Last known updatedAt value for optimistic concurrency control

    UpdateUserProfileRequest:
      type: object
      required: [updatedAt]
      properties:
        fullName:
          type: string
        phone:
          type: string
        updatedAt:
          type: string
          format: date-time
          description: Last known updatedAt value for optimistic concurrency control

  responses:

    ErrorResponse:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnauthenticatedResponse:
      description: "Authentication required (code: UNAUTHENTICATED)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ForbiddenResponse:
      description: "Insufficient permissions (code: FORBIDDEN)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UserNotFoundResponse:
      description: "User not found (code: USER_NOT_FOUND)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailableResponse:
      description: "Service temporarily unavailable (code: SERVICE_UNAVAILABLE)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequestResponse:
      description: "Invalid request (code: BAD_REQUEST)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ConflictResponse:
      description: "Conflict: concurrent modification or business rule violation (code: OUTDATED_DATA | SELF_MODIFICATION_NOT_ALLOWED)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsResponse:
      description: "Too many requests (code: TOO_MANY_REQUESTS)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'