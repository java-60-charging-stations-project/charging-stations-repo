      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '200':
          description: User details returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteUser
      summary: Delete user
      description: Deletes a Cognito user account. Admins cannot delete their own account.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users/{userId}/role:
    patch:
      operationId: changeUserRole
      summary: Change user role
      description: Changes a user's role via Cognito groups. The request must provide both oldRole and newRole, and they must differ. Admins cannot modify their own role.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '204':
          description: Role changed successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users/{userId}/enable:
    patch:
      operationId: enableUser
      summary: Enable user
      description: Enables a Cognito user account. Admins cannot enable their own account.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '204':
          description: User enabled successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /admin/users/{userId}/disable:
    patch:
      operationId: disableUser
      summary: Disable user
      description: Disables a Cognito user account. Admins cannot disable their own account.
      x-roles: [ADMIN]
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito user identifier.
          schema:
            type: string
      responses:
        '204':
          description: User disabled successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/UserNotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito access token (`token_use=access`).

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    PaginationMeta:
      type: object
      description: Pagination metadata for station/user/log list endpoints.
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    Meta:
      description: Alias for PaginationMeta (legacy name in this spec).
      $ref: '#/components/schemas/PaginationMeta'

    SessionListMeta:
      type: object
      description: Metadata returned with gateway session list endpoints (`GET /sessions`, `GET /sessions/all`).
      required: [count, role]
      properties:
        count:
          type: integer
          description: Number of sessions in `data`.
        role:
          $ref: '#/components/schemas/ViewerRole'

    SessionDetailMeta:
      type: object
      description: Metadata returned with `GET /sessions/{sessionId}` (gateway).
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ViewerRole'

    ViewerRole:
      type: string
      enum: [USER, SUPPORT, ADMIN]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INTERNAL_ERROR
            message:
              type: string
              example: Internal server error

    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    Port:
      type: object
      required: [id, number, status]
      properties:
        id:
          type: string
        number:
          type: integer
        status:
          type: string

    RatePlan:
      type: object
      description: Matches gateway / Lambda `ratePlan` (ISO 4217 + peak/off-peak pricing).
      required: [currencyCode, currencyName, peakRate, offPeakRate]
      properties:
        currencyCode:
          type: string
          example: ILS
        currencyName:
          type: string
          example: Israeli Shekel
        peakRate:
          type: number
          format: float
        offPeakRate:
          type: number
          format: float

    StationBase:
      type: object
      description: Station projection returned by gateway list/get endpoints (camelCase).
      required:
        - id
        - code
        - name
        - owner
        - city
        - address
        - phone
        - email
        - siteTechnician
        - portsCount
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        code:
          type: string
          description: Unique station code.
        name:
          type: string
        owner:
          type: string
        city:
          type: string
        address:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        siteTechnician:
          type: string
          nullable: true
        location:
          $ref: '#/components/schemas/Location'
        maxPowerKw:
          type: number
          format: float
          nullable: true
        portsCount:
          type: integer
          minimum: 0
          description: Total number of ports registered at this station.
        occupiedPorts:
          type: integer
          minimum: 0
        blockedUntil:
          type: string
          format: date-time
          nullable: true
        hasFreePorts:
          type: boolean
        state:
          type: string
          enum: [INACTIVE, ACTIVE, OUT_OF_SERVICE]
        ratePlan:
          $ref: '#/components/schemas/RatePlan'
        createdAt:
          type: string
          format: date-time
          example: "2026-02-18T09:30:45+02:00"
        updatedAt:
          type: string
          format: date-time
          example: "2026-03-18T11:07:12Z"
        ports:
          type: array
          description: >
            Full port details for this station.
            Present only when the `includePorts=true` query parameter is supplied.
          items:
            $ref: '#/components/schemas/StationPort'
      example:
        id: stn-8f2a9b31
        code: HA-DC-0018
        name: Riverside Fast Charge
        owner: GreenVolt Operations Ltd.
        city: Haifa
        address: 18 Hanamal St
        phone: null
        email: null
        siteTechnician: Station technician
        maxPowerKw: 150
        portsCount: 8
        location:
          latitude: 37.419734
          longitude: -122.0827784
        state: ACTIVE
        ratePlan:
          currencyCode: ILS
          currencyName: Israeli Shekel
          peakRate: 1.92
          offPeakRate: 1.34
        createdAt: "2025-11-04T07:16:28+02:00"
        updatedAt: "2026-03-18T10:41:03Z"
        ports:
          - portId: prt-a1b2c3d4
            portCode: PORT-A1
            status: FREE
            lastMeterKw: 0.0
            createdAt: "2025-11-04T07:16:28+02:00"
            updatedAt: "2026-03-18T10:41:03Z"
          - portId: prt-e5f6a7b8
            portCode: PORT-A2
            status: OCCUPIED
            lastMeterKw: 42.5
            createdAt: "2025-11-04T07:16:28+02:00"
            updatedAt: "2026-03-18T10:41:03Z"

    StationDetailed:
      allOf:
        - $ref: '#/components/schemas/StationBase'
        - type: object
          properties:
            location:
              $ref: '#/components/schemas/Location'
            portCount:
              type: integer
            ports:
              type: array
              items:
                $ref: '#/components/schemas/Port'

    StationBaseSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StationBase'

    StationBaseCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StationBase'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    StationPort:
      type: object
      description: A physical charging port belonging to a station.
      required: [portId, portCode, status, lastMeterKw, createdAt, updatedAt]
      properties:
        portId:
          type: string
          description: Unique port identifier.
        portCode:
          type: string
          description: Human-readable port code (e.g. PORT-A1).
        status:
          type: string
          enum: [DISABLED, FREE, BOOKED, OCCUPIED, ERROR]
        lastMeterKw:
          type: number
          format: float
          description: Last recorded meter value in kW.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StationPortCreate:
      type: object
      required: [portCode]
      properties:
        portCode:
          type: string
          description: Human-readable port code to assign to the new port.

    StationPortsCreateRequest:
      type: object
      required: [ports]
      properties:
        ports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StationPortCreate'

    StationPortsListApiResponse:
      type: object
      description: Response envelope for GET /support/stations/{stationId}/ports and GET /user/stations/{stationId}/ports.
      required: [data]
      properties:
        data:
          type: object
          required: [ports]
          properties:
            ports:
              type: array
              items:
                $ref: '#/components/schemas/StationPort'

    StationPortsCreateApiResponse:
      type: object
      description: Response envelope for POST /support/stations/{stationId}/ports.
      required: [data]
      properties:
        data:
          type: object
          required: [ports]
          properties:
            ports:
              type: array
              items:
                $ref: '#/components/schemas/StationPort'

    StationDetailedSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StationDetailed'

    StationDetailedCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StationDetailed'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateStationGatewayResponse:
      type: object
      description: Gateway JSON for `POST /admin/stations` (Express returns `code` + `data`).
      required: [code, data]
      properties:
        code:
          type: integer
          example: 201
        data:
          $ref: '#/components/schemas/CreateStationResponseData'

    CreateStationResponseData:
      type: object
      required: [stationId]
      properties:
        stationId:
          type: string
          description: New station id returned by the write Lambda (`station_id` mapped to camelCase).

    UpdateStationStateGatewayResponse:
      type: object
      description: Gateway JSON for `PATCH .../state` (wraps Lambda `updated_at` as `updatedAt`).
      required: [code, data]
      properties:
        code:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/UpdateStationStateData'

    UpdateStationStateData:
      type: object
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time

    AdminCreateStationRequest:
      type: object
      required:
        - code
        - name
        - owner
        - city
        - address
        - ratePlan
        - location
        - siteTechnician
        - phone
        - email
        - maxPowerKw
      properties:
        code:
          type: string
          description: Unique station code.
        name:
          type: string
        owner:
          type: string
        city:
          type: string
        address:
          type: string
        ratePlan:
          $ref: '#/components/schemas/RatePlan'
        location:
          $ref: '#/components/schemas/Location'
        siteTechnician:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        maxPowerKw:
          type: number
          format: float
        ports:
          type: integer
          minimum: 0
          description: Optional total connector count; forwarded to write Lambda (default 0 if omitted).

    UpdateStationStateRequest:
      type: object
      required: [oldState, newState, updatedAt]
      properties:
        oldState:
          type: string
          enum: [INACTIVE, ACTIVE, OUT_OF_SERVICE]
        newState:
          type: string
          enum: [INACTIVE, ACTIVE, OUT_OF_SERVICE]
        updatedAt:
          type: string
          format: date-time
          description: Last known updatedAt value for optimistic concurrency control

    AdminUpdateStationRequest:
      type: object
      description: Partial update body for `PATCH /admin/stations/{stationId}`.
      additionalProperties: false
      properties:
        name:
          type: string
        owner:
          type: string
        city:
          type: string
        address:
          type: string
        ratePlan:
          $ref: '#/components/schemas/RatePlan'
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        siteTechnician:
          type: string
          nullable: true
        maxPowerKw:
          type: number
          format: float
          nullable: true
        location:
          $ref: '#/components/schemas/Location'

    SupportUpdatePortStateRequest:
      type: object
      additionalProperties: false
      required: [portCode, oldState, newState]
      properties:
        portCode:
          type: string
          description: Port code on the station (Lambda builds sort key `PORT#<code>`)
        oldState:
          type: string
          enum: [FREE, OCCUPIED, ERROR, DISABLED, BOOKED]
          description: Expected current Dynamo `state` (must match or update fails)
        newState:
          type: string
          enum: [FREE, DISABLED]
          description: Target state for support (`supportUpdateStationPorts` in write Lambda)

    SupportUpdatePortStateResponse:
      type: object
      required: [stationId, entityKey, newState, updatedAt]
      properties:
        stationId:
          type: string
        entityKey:
          type: string
          description: Port row key prefix form, e.g. `PORT#PORT-A1`
        newState:
          type: string
        updatedAt:
          type: string
          format: date-time

    UpdateStationGatewayResponse:
      type: object
      description: Gateway JSON for `PATCH /admin/stations/{stationId}`.
      required: [code, data]
      properties:
        code:
          type: integer
          example: 200
        data:
          type: object
          required: [stationId]
          properties:
            stationId:
              type: string

    UserSessionState:
      type: string
      enum: [BOOKED, ACTIVE, UNPAID]

    UserSessionPortState:
      type: string
      enum: [FREE, BOOKED, OCCUPIED, ERROR, DISABLED]

    UserSession:
      type: object
      required: [sessionId, stationId, entityKey, portCode, state, userId, createdAt, updatedAt]
      properties:
        sessionId:
          type: string
        stationId:
          type: string
        entityKey:
          type: string
        portCode:
          type: string
        state:
          $ref: '#/components/schemas/UserSessionState'
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        timeBookedAt:
          type: string
          format: date-time
          nullable: true
        timeBookedBefore:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
        tariff:
          oneOf:
            - type: number
            - type: string
          nullable: true
        currentCost:
          oneOf:
            - type: number
            - type: string
          nullable: true
        energyConsumedKwh:
          oneOf:
            - type: number
            - type: string
          nullable: true
        estimatedMinutesRemaining:
          type: integer
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        bookingDurationMinutes:
          type: integer
          nullable: true
        chargeLevelPercent:
          type: integer
          nullable: true

    UserSessionsApiResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [sessions]
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/UserSession'

    UserSessionPortUpdateRequest:
      type: object
      required: [stationId, portCode, oldState]
      properties:
        stationId:
          type: string
        portCode:
          type: string
        oldState:
          $ref: '#/components/schemas/UserSessionPortState'

    UserSessionPortUpdateResponse:
      type: object
      required: [stationId, portCode, newState, updatedAt]
      properties:
        stationId:
          type: string
        portCode:
          type: string
        newState:
          type: string
        updatedAt:
          type: string
          format: date-time
        timeBookedAt:
          type: string
          format: date-time
        timeBookedBefore:
          type: string
          format: date-time
        sessionId:
          type: string

    UserSessionPortUpdateApiResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/UserSessionPortUpdateResponse'

    Session:
      type: object
      required:
        - id
        - stationId
        - status
        - startedAt
        - durationMinutes
        - chargeLevelPercent
        - energyConsumedKWh
        - maxPowerKw
        - pricePerKWh
        - currentCost
        - currency
        - estimatedMinutesRemaining
      properties:
        id:
          type: string
        stationId:
          type: string
        status:
          type: string
          enum: [preparing, charging, paused, completed, faulted, error]
        startedAt:
          type: string
          format: date-time
          example: '2026-03-04T09:00:00Z'
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
        chargeLevelPercent:
          type: integer
        energyConsumedKWh:
          type: number
          format: float
          example: 18.4
        maxPowerKw:
          type: integer
        pricePerKWh:
          type: number
          format: float
          example: 1.50
        currentCost:
          type: number
          format: float
          example: 27.60
        currency:
          type: string
          example: ILS
        estimatedMinutesRemaining:
          type: integer
          example: 25

    SessionSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Session'

    SessionDetailedItem:
      type: object
      required:
        - id
        - stationId
        - status
        - startedAt
        - durationMinutes
        - chargeLevelPercent
        - energyConsumedKWh
        - maxPowerKw
        - pricePerKWh
        - currentCost
        - currency
        - portId
        - userId
      properties:
        id:
          type: string
        stationId:
          type: string
        portId:
          type: string
        status:
          type: string
          enum: [preparing, charging, paused, completed, faulted, error]
        startedAt:
          type: string
          format: date-time
          example: '2026-03-04T09:00:00Z'
        endedAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
        chargeLevelPercent:
          type: integer
        energyConsumedKWh:
          type: number
          format: float
        maxPowerKw:
          type: integer
        pricePerKWh:
          type: number
          format: float
        currentCost:
          type: number
          format: float
        currency:
          type: string
        userId:
          type: string
          description: User who initiated the session

    SessionDetailedCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SessionDetailedItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    StartSessionRequest:
      type: object
      description: Gateway body for `POST /sessions`. User is taken from JWT (`sub`); do not send `userId`.
      required: [stationId, portId]
      properties:
        stationId:
          type: string
        portId:
          type: string

    ChargingSessionRecord:
      type: object
      description: Raw session row returned by gateway start/stop (mock/local until backed by Lambda).
      required:
        - sessionId
        - userId
        - stationId
        - portId
        - startedAt
        - endedAt
        - status
        - energyKwh
        - diagnostics
        - internalNote
        - billingCents
      properties:
        sessionId:
          type: string
        userId:
          type: string
        stationId:
          type: string
        portId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED, FAILED]
        energyKwh:
          type: number
          format: float
          nullable: true
        diagnostics:
          type: string
          nullable: true
        internalNote:
          type: string
          nullable: true
        billingCents:
          type: integer
          nullable: true
          description: Billing in minor units (e.g. cents) when applicable.

    ChargingSessionUserView:
      type: object
      required: [role, sessionId, stationId, portId, startedAt, endedAt, status, energyKwh]
      properties:
        role:
          type: string
          enum: [USER]
        sessionId: { type: string }
        stationId: { type: string }
        portId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED, FAILED] }
        energyKwh: { type: number, format: float, nullable: true }

    ChargingSessionSupportView:
      type: object
      required: [role, sessionId, userId, stationId, portId, startedAt, endedAt, status, energyKwh, diagnostics]
      properties:
        role:
          type: string
          enum: [SUPPORT]
        sessionId: { type: string }
        userId: { type: string }
        stationId: { type: string }
        portId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED, FAILED] }
        energyKwh: { type: number, format: float, nullable: true }
        diagnostics: { type: string, nullable: true }

    ChargingSessionAdminView:
      type: object
      required: [role, sessionId, userId, stationId, portId, startedAt, endedAt, status, energyKwh, diagnostics, internalNote, billingCents]
      properties:
        role:
          type: string
          enum: [ADMIN]
        sessionId: { type: string }
        userId: { type: string }
        stationId: { type: string }
        portId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED, FAILED] }
        energyKwh: { type: number, format: float, nullable: true }
        diagnostics: { type: string, nullable: true }
        internalNote: { type: string, nullable: true }
        billingCents: { type: integer, nullable: true }

    ChargingSessionProjected:
      oneOf:
        - $ref: '#/components/schemas/ChargingSessionUserView'
        - $ref: '#/components/schemas/ChargingSessionSupportView'
        - $ref: '#/components/schemas/ChargingSessionAdminView'

    GatewaySessionListResponse:
      type: object
      required: [code, data, meta]
