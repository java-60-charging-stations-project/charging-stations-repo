      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ForbiddenResponse:
      description: "Insufficient permissions (code: FORBIDDEN)"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UserNotFoundResponse:
      description: "User not found (code: USER_NOT_FOUND)"
