        slotTo:
          type: string
          format: date-time
          description: Booking window end (ISO-8601).

    BookingDto:
      type: object
      required: [bookingId, userId, stationId, slotFrom, slotTo, status]
      properties:
        bookingId:
          type: string
        userId:
          type: string
        stationId:
          type: string
        slotFrom:
          type: string
          format: date-time
        slotTo:
          type: string
          format: date-time
        status:
          type: string
          enum: [created, cancelled, expired, paid]
        penaltyBillingCents:
          type: integer
