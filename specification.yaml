  /support/stations:
    get:
      operationId: listSupportStations
      summary: Get list of support stations
      description: Returns support station information filtered by city and provider. Requires Cognito JWT and **SUPPORT** group.
      security:
        - bearerAuth: []
      parameters:
        - name: city
          in: query
          required: false
          description: City name prefix filter (wildcard search, e.g. "Tel" matches "Tel Aviv")
          schema:
            type: string
        - name: owner
          in: query
          required: false
          description: Station owner prefix filter (wildcard search)
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: Station state filter (exact match)
          schema:
            type: string
            enum: [INACTIVE, ACTIVE, OUT_OF_SERVICE]
        - name: orderBy
          in: query
          required: false
          description: >
            Comma-separated list of sort tokens. Allowed tokens: name+ (name asc), name- (name desc),
            owner+ (owner asc), owner- (owner desc). Results are always additionally sorted by id asc
            as the final condition.
          schema:
            type: string
            example: "name+,owner-"
        - name: page
          in: query
          required: false
          description: Page number for pagination (defaults to 1 if omitted)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Number of items per page (defaults to 200 if omitted)
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of support stations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseCollectionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /support/stations/{stationId}:
    get:
      operationId: getSupportStationById
      summary: Get support station by ID
      description: >
        Returns a single station by its ID. Identical response shape to
        `GET /user/stations/{stationId}` and `GET /admin/stations/{stationId}`.
        When `includePorts=true` the response includes the full `ports` array.
        Requires Cognito JWT and **SUPPORT** group.
      security:
        - bearerAuth: []
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
        - name: includePorts
          in: query
          required: false
          description: When `true`, the response `data` object includes the `ports` array with full port details.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Charging station data (includes `ports` when `includePorts=true`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: patchSupportStation
      summary: Partially update station metadata (support)
      description: |
        Same body and behavior as `PATCH /admin/stations/{stationId}` — partial update via stations write Lambda (`updateStation`).
        Requires Cognito JWT and **SUPPORT** group.
      security:
        - bearerAuth: []
      x-roles: [SUPPORT]
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateStationRequest'
      responses:
        '200':
          description: Station updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStationGatewayResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /support/stations/{stationId}/state:
    patch:
      operationId: updateSupportStationState
      summary: Change charging station state as support
      description: |
        Changes station lifecycle state via `changeStationState` (RDS). Same contract as admin `PATCH .../state`.
        Requires Cognito JWT and **SUPPORT** group. Body includes `oldState`, `newState`, and `updatedAt` for optimistic concurrency.
      x-roles: [TECH_SUPPORT]
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStationStateRequest'
      responses:
        '200':
          description: Charging station state updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationBaseSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /support/stations/{stationId}/ports/state:
    patch:
      operationId: supportUpdateStationPortState
      summary: Set port operational state (support)
      description: |
        Invokes Dynamo write Lambda action `supportUpdateStationPorts` (optimistic `oldState` → `newState`).
        Typical use: enable a new port (`DISABLED` → `FREE`) or take a port offline (`FREE` → `DISABLED`).
        Forbidden transitions include `BOOKED` → `FREE` and `OCCUPIED` → `FREE` (same rules as Lambda).
        Requires Cognito JWT and **SUPPORT** group.
      security:
        - bearerAuth: []
      x-roles: [SUPPORT]
      parameters:
        - name: stationId
          in: path
          required: true
          description: Station identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportUpdatePortStateRequest'
      responses:
        '200':
          description: Port state updated
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/SupportUpdatePortStateResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

